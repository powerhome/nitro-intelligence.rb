name: nitro_intelligence

on:
  push:
    # release.sh's scratch branch is never a PR head, so it needs no checks. Listing tags keeps
    # the gem release job running on release tags, which a branch filter alone would stop.
    branches-ignore: [automated-release-staging]
    tags: ["**"]

jobs:
  ruby:
    uses: powerhome/github-actions-workflows/.github/workflows/ruby-gem.yml@5863b64d44ea6a59869f11f5880a5531b6b9f0d6 # main
    with:
      package: ${{ github.workflow }}
      workdir: .
      ruby: '["3.3"]'
    secrets: inherit
