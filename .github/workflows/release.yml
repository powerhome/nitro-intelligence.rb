# Releases with release-please, from the Conventional Commit PR titles on main. After every push
# to main, it publishes the GitHub release `vX.Y.Z` for a release PR that just merged and tags the
# same commit `vX.Y.Z-nitro_intelligence` to publish the gem, then opens or refreshes the one
# release PR for whatever `feat`, `fix` and breaking changes have merged since. Settings are in
# release-please-config.json, and the last released version in .release-please-manifest.json.
#
# It runs as the release GitHub App, not GITHUB_TOKEN: a PR or tag GITHUB_TOKEN creates starts no
# workflows, so the release PR would never get its required checks and the tag would never publish
# the gem. The App also signs the release commit, which main's ruleset requires.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # The steps come from the dispatched ref's copy of this file, so a dispatch from another
    # branch would run that branch's version of them with the App's write token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release, and propose the next release
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The shared ruby-gem.yml publishes only from a tag containing both `refs/tags/v` and the
      # package name. Neither release-please's `vX.Y.Z` nor its component-first form,
      # `nitro_intelligence-vX.Y.Z`, matches both. So tag the same commit
      # `vX.Y.Z-nitro_intelligence`, as releases before release-please were; its push runs
      # nitro_intelligence.yml's release job. release-please keeps its own `vX.Y.Z`, which it
      # finds the last release by. This checks the latest release on every run, not only the one
      # that created it, so a rerun after a failed tag still publishes.
      - name: Tag the latest release for publishing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh release view --json tagName --jq .tagName)
          if [[ ! $release =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The latest release, $release, is not one of release-please's, so there is nothing to tag."
            exit 0
          fi
          publish="$release-nitro_intelligence"
          if gh api "repos/$GH_REPO/git/ref/tags/$publish" --silent 2>/dev/null; then
            echo "$publish already exists."
            exit 0
          fi
          sha=$(gh api "repos/$GH_REPO/commits/$release" --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$publish" -f sha="$sha" --jq .ref

      # release-please can't assign its PR. Assign whoever merged PRs since the last release, bots
      # left out, most recent first and at most 10, GitHub's limit on assignees. It's a courtesy,
      # so a failed lookup leaves the PR unassigned rather than failing the run.
      - name: Assign the release PR
        if: steps.release-please.outputs.pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          number=$(jq -r .number <<<"$PR")
          tag=$(gh release view --json tagName --jq .tagName)
          assignees=$(
            gh api --paginate "repos/$GH_REPO/compare/$tag...main" --jq '.commits | reverse | .[].sha' |
              while read -r sha; do
                gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at) | .number'
              done | awk '!seen[$0]++' |
              while read -r pr; do
                gh api "repos/$GH_REPO/pulls/$pr" --jq 'select(.merged_by.type == "User") | .merged_by.login'
              done | awk '!seen[$0]++ && count++ < 10' | paste -sd, -
          )
          if [[ -n $assignees ]]; then
            gh pr edit "$number" --add-assignee "$assignees"
          else
            echo "Nobody merged a PR since $tag, so the release PR stays unassigned."
          fi
