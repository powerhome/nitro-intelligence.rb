# Releases from the changelog. After every push to main, publishes a GitHub release for a
# version that has none yet (the release PR just merged), then opens or refreshes the one
# `chore: release X.Y.Z` PR for the Unreleased changelog entries. See .github/scripts/release.sh.
#
# It runs as the release GitHub App, not GITHUB_TOKEN: a PR or tag GITHUB_TOKEN creates
# starts no workflows, so the release PR would never get its required checks and the
# release tag would never run the gem release job. The App also signs the release commit,
# which main's ruleset requires.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # The checkout below always reads main, but the steps come from the dispatched ref's copy of
    # this file, so a dispatch from another branch would run that branch's version of them with
    # the App's write token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main as it is now, not the commit that triggered the run: a rerun of an old push
          # would otherwise rebuild the release PR from an outdated changelog.
          ref: refs/heads/main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # A release that fails still lets the next one be proposed, and fails the run at the end.
      - name: Publish the release of a merged release PR
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/release.sh release

      - name: Prepare the next release
        id: proposal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/release.sh propose

      # Rebuilds the branch from main with the release edits, and closes the PR once main has
      # nothing left to release, since the branch then no longer differs from main.
      - name: Open or refresh the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automated-release
          base: main
          # Only the release edits, whatever else the job may have left in the checkout.
          add-paths: |
            docs/CHANGELOG.md
            lib/nitro_intelligence/version.rb
            Gemfile.lock
          delete-branch: true
          sign-commits: true
          commit-message: "chore: release ${{ steps.proposal.outputs.version }}"
          title: "chore: release ${{ steps.proposal.outputs.version }}"
          body-path: ${{ steps.proposal.outputs.body-path }}
          assignees: ${{ steps.proposal.outputs.assignees }}

      - name: Fail the run if the release failed
        if: steps.release.outcome == 'failure'
        run: |
          echo "::error::Publishing the release failed; see the \"Publish the release of a merged release PR\" step."
          exit 1
