# Adds every new or reopened issue to the Nitro Intelligence project. The project's own
# auto-add workflows are capped per plan and cannot cover every NIP repository, so the
# repositories beyond that cap add their issues here instead.

name: Add issues to the Nitro Intelligence project

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint project App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NIP_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIP_PROJECT_APP_PRIVATE_KEY }}
          owner: powerhome
          permission-issues: read
          permission-organization-projects: write

      - name: Add issue to project
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/powerhome/projects/18
          github-token: ${{ steps.app-token.outputs.token }}
