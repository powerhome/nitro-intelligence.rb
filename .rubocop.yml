inherit_from: .rubocop_todo.yml

# Add to RuboCop's default excludes (vendor/, .git/, node_modules/) rather than replacing them;
# CI installs gems into vendor/bundle.
inherit_mode:
  merge:
    - Exclude

require:
  - rubocop-powerhome

AllCops:
  TargetRubyVersion: 3.3
  Exclude:
    - '.console_setup.rb'

Layout/LineLength:
  Exclude:
    - '../**/spec/**/*_spec.rb'

Performance/ChainArrayAllocation:
  Enabled: false

Rails:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: never
